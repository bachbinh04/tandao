<main class="pst-page">
  <div class="pst-head">
   
    <a class="pst-back" href="works.html">← BACK TO WORKS</a>
  </div>

  <!-- A staircase from left to right: four columns, each set a step lower
       than the one before it (style.css). Click a poster to see it whole. -->
  <section class="pst-grid">
    <figure class="pst-item">
      <div class="pst-img"><img src="images/poster-grid/trungthu.jpg" data-full="images/poster-grid/trungthu-full.jpg" width="900" height="1158" alt="Trung Thu poster" loading="lazy" decoding="async"></div>
      <figcaption>
        <h2>TRUNG THU</h2>
        <p>Mid-autumn festival poster — soft light, warm colour, a little astronaut for scale.</p>
        <div class="pst-meta"><span>FESTIVAL / ILLUSTRATION</span><span>N°01</span></div>
      </figcaption>
    </figure>
    <figure class="pst-item">
      <div class="pst-img"><img src="images/poster-grid/octopus.jpg" data-full="images/poster-grid/octopus-full.jpg" width="900" height="1158" alt="Octopus In The Dark poster" loading="lazy" decoding="async"></div>
      <figcaption>
        <h2>OCTOPUS IN THE DARK</h2>
        <p>Editorial poster study — a glowing silhouette, halftone texture, circular type running through it.</p>
        <div class="pst-meta"><span>EDITORIAL / TYPE</span><span>N°02</span></div>
      </figcaption>
    </figure>
    <figure class="pst-item">
      <div class="pst-img"><img src="images/poster-grid/into-the-forest.jpg" data-full="images/poster-grid/into-the-forest-full.jpg" width="900" height="1272" alt="Into The Forest poster" loading="lazy" decoding="async"></div>
      <figcaption>
        <h2>INTO THE FOREST</h2>
        <p>Soundtrack poster — a photo-composite of a fox mid-leap through forest god-rays, reaching for a small burning flower.</p>
        <div class="pst-meta"><span>SOUNDTRACK / COMPOSITE</span><span>N°03</span></div>
      </figcaption>
    </figure>
    <figure class="pst-item">
      <div class="pst-img"><img src="images/poster-grid/com-tam.jpg" data-full="images/poster-grid/com-tam-full.jpg" width="900" height="1274" alt="Cơm Tấm poster" loading="lazy" decoding="async"></div>
      <figcaption>
        <h2>CƠM TẤM</h2>
        <p>Paper-collage food poster — Saigon landmarks torn from old newsprint, gathered around a plate of broken rice.</p>
        <div class="pst-meta"><span>FOOD / COLLAGE</span><span>N°04</span></div>
      </figcaption>
    </figure>
    <figure class="pst-item">
      <div class="pst-img"><img src="images/poster-grid/made-in-vietnam.jpg" data-full="images/poster-grid/made-in-vietnam-full.jpg" width="900" height="1158" alt="Made In Vietnam poster" loading="lazy" decoding="async"></div>
      <figcaption>
        <h2>MADE IN VIETNAM</h2>
        <p>Product poster — gold type on lacquer red, with two pairs of chopsticks standing in for the letters they interrupt.</p>
        <div class="pst-meta"><span>PRODUCT / TYPOGRAPHY</span><span>N°05</span></div>
      </figcaption>
    </figure>
    <figure class="pst-item">
      <div class="pst-img"><img src="images/poster-grid/vong-xoay.jpg" data-full="images/poster-grid/vong-xoay-full.jpg" width="900" height="1274" alt="Vòng Xoáy Tuyệt Vọng poster" loading="lazy" decoding="async"></div>
      <figcaption>
        <h2>VÒNG XOÁY TUYỆT VỌNG</h2>
        <p>Environmental poster — Vietnam held inside a blackened globe, bound in chain, one smokestack still running.</p>
        <div class="pst-meta"><span>ENVIRONMENT / AWARENESS</span><span>N°06</span></div>
      </figcaption>
    </figure>
    <figure class="pst-item">
      <div class="pst-img"><img src="images/poster-grid/looking.jpg" data-full="images/poster-grid/looking-full.jpg" width="900" height="1114" alt="Looking poster" loading="lazy" decoding="async"></div>
      <figcaption>
        <h2>LOOKING</h2>
        <p>Duotone type study — a kitten pushing out from behind oversized outlined letters, framed by heavy quote marks.</p>
        <div class="pst-meta"><span>TYPE / DUOTONE</span><span>N°07</span></div>
      </figcaption>
    </figure>
  </section>
